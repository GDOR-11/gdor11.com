events {
    worker_connections  1024;
}

http {
    include mime.types;

    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        http2 on;
        server_name gdor11.com www.gdor11.com;
        ssl_certificate /run/secrets/fullchain;
        ssl_certificate_key /run/secrets/privkey;

        location / {
            alias /srv/static_serve/homepage/;
        }
        location /server_test/ {
            alias /srv/static_serve/server_test/;
        }
        location /server_test/api {
            proxy_pass http://server_test:8080;
        }
    }
}
